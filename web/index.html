<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>00기업 | 통근·식수 관리</title><link rel="stylesheet" href="style.css"></head><body>
<header><span class="logo">00</span><b>00기업</b><span class="divider"></span> 임직원 서비스 <span id="identity"></span></header>
<main><section id="login"><div class="intro"><span class="eyebrow">임직원 업무 포털</span><h1>통근 및 식수<br>인원관리</h1><p>식단 확인부터 통근 신청까지,<br>근무일에 필요한 정보를 한곳에서 확인하세요.</p><div class="chips">점심 · 저녁 · 야간　 /　 주간 · 야간 통근</div></div>
<form id="signin" class="panel"><h2>로그인</h2><div class="segments" id="roles"><button type="button" data-role="직원" class="selected">직원</button><button type="button" data-role="영양사">영양사</button><button type="button" data-role="관리자">관리자</button></div><label>회사 이메일<input name="email" type="email" required autocomplete="username" placeholder="name@company.co.kr"></label><label>비밀번호<input name="password" type="password" required autocomplete="current-password"></label><button class="primary wide">로그인</button><p id="setupHint"></p></form></section>
<section id="portal" hidden><div class="toolbar"><div><small id="roleText"></small><h1 id="heading"></h1></div><button id="logout">로그아웃</button></div><nav id="nav"></nav><div class="filters"><label>근무일<input id="day" type="date"></label><label>조회 월<input id="month" type="month"></label><button id="reload">새로고침</button></div><div id="content"></div></section><div id="message" role="status" aria-live="polite"></div></main>
<script src="vendor/supabase.js"></script><script src="vendor/xlsx.mini.min.js"></script><script src="config.js"></script><script src="app.js"></script></body></html>
